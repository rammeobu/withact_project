<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 파티 메이커</title>
</head>
<body>
<h2>로그인</h2>
<form th:action="@{/login}" th:object="${loginRequest}" method="post">
    <div>
        <label>아이디: </label>
        <input type="text" th:field="*{loginId}">
    </div>
    <div>
        <label>비밀번호: </label>
        <input type="password" th:field="*{password}">
    </div>
    <button type="submit">로그인</button>
</form>
<p>아직 회원이 아니신가요? <a th:href="@{/join}">회원가입</a></p>
</body>
</html>
