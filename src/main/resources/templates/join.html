<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 파티 메이커</title>
    <style>
        .error-msg { color: red; font-size: 0.8em; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>

<h2>회원가입</h2>

<form th:action="@{/join}" th:object="${joinRequest}" method="post">

    <div class="form-group">
        <label for="loginId">아이디:</label><br>
        <input type="text" th:field="*{loginId}" id="loginId" placeholder="아이디를 입력하세요">
        <div class="error-msg" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></div>
    </div>

    <div class="form-group">
        <label for="password">비밀번호:</label><br>
        <input type="password" th:field="*{password}" id="password" placeholder="비밀번호를 입력하세요">
        <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <div class="form-group">
        <label for="passwordConfirm">비밀번호 확인:</label><br>
        <input type="password" th:field="*{passwordConfirm}" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요">
    </div>

    <div class="form-group">
        <label for="username">이름:</label><br>
        <input type="text" th:field="*{username}" id="username" placeholder="이름을 입력하세요">
        <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>

    <button type="submit">가입하기</button>
</form>

<p>이미 계정이 있으신가요? <a th:href="@{/login}">로그인하러 가기</a></p>

</body>
</html>
